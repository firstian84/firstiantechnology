<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expedisi Control</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --primary-orange: #ff6600;
            --accent-glow: #ff9900;
            --cyber-neon: #ffaa00;
            --cyber-amber: #ff5500;
            --panel-bg: rgba(15, 10, 5, 0.9);
            --border-neon: rgba(255, 102, 0, 0.4);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #000000;
            color: var(--cyber-neon);
        }

        /* Map Background Penuh */
        #mapContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: #140a02; /* Warna dasar jika tile loading */
        }
        
        /* Filter kustom agar tile OpenStreetMap terlihat bernuansa gelap/oranye taktis */
        .leaflet-tile {
            filter: brightness(0.6) invert(1) contrast(1.2) hue-rotate(160deg);
        }

        /* Tactical Glassmorphism Control Panel */
       .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 420px;
            max-height: calc(100vh - 40px);
            z-index: 10;
            /* Ubah nilai 0.85 di bawah ini untuk mengatur tingkat transparansi (0.0 - 1.0) */
            background: rgba(15, 10, 5, 0.8); 
            backdrop-filter: blur(2px);
            border: 1px solid var(--primary-orange);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.25);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .btn {
            color: #000000;
            border: 1px solid transparent;
            padding: 12px 20px;
            font-size: 13px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex: 1;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-view {
            background-color: var(--primary-orange);
            color: #000;
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.4);
        }

        .btn-view:hover:not(:disabled) {
            background-color: #000000;
            color: var(--primary-orange);
            border-color: var(--primary-orange);
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.7);
        }

        .btn-delete {
            background-color: #cc2200;
            color: #fff;
            box-shadow: 0 0 10px rgba(204, 34, 0, 0.4);
        }

        .btn-delete:hover:not(:disabled) {
            background-color: #000000;
            color: #ff3300;
            border-color: #ff3300;
            box-shadow: 0 0 15px rgba(255, 51, 0, 0.7);
        }

        .btn-toggle {
            background-color: #1a1005;
            color: var(--accent-glow);
            border: 1px solid var(--accent-glow);
            box-shadow: 0 0 10px rgba(255, 153, 0, 0.2);
            width: 100%;
            margin-bottom: 20px;
        }

        .btn-toggle:hover:not(:disabled) {
            background-color: var(--accent-glow);
            color: #000;
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.6);
        }

        .btn-toggle.active {
            background-color: #ff5500 !important;
            color: #fff !important;
            border-color: #ff5500 !important;
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.8) !important;
        }

        .btn:disabled {
            background-color: #1a1a1a !important;
            color: #444444 !important;
            border-color: #444444 !important;
            box-shadow: none !important;
            cursor: not-allowed;
            opacity: 0.5;
        }

        h2 {
            color: var(--primary-orange);
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 102, 0, 0.6);
            font-size: 22px;
            text-align: center;
        }

        .listed-counter {
            background: rgba(255, 102, 0, 0.08);
            border: 1px dashed rgba(255, 102, 0, 0.4);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            color: var(--cyber-neon);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 1px;
        }

        .listed-counter .counter-value {
            color: var(--primary-orange);
            text-shadow: 0 0 8px rgba(255, 102, 0, 0.8);
        }

        .data-item-wrapper {
            display: flex;
            align-items: stretch;
            gap: 8px;
            margin-bottom: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .data-item-btn {
            background-color: rgba(20, 12, 5, 0.85);
            color: var(--accent-glow);
            border: 1px solid rgba(255, 153, 0, 0.4);
            text-align: left;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.2s ease;
            flex: 1;
            word-break: break-all;
            overflow: hidden;
        }

        .data-item-btn:hover {
            background-color: rgba(255, 102, 0, 0.15);
            border-color: var(--primary-orange);
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.4);
        }

        .data-item-btn.active {
            background-color: var(--primary-orange) !important;
            color: #000000 !important;
            border-color: var(--primary-orange) !important;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.8);
        }

        .btn-delete-single {
            background-color: rgba(34, 15, 10, 0.85);
            color: #ff3300;
            border: 1px solid rgba(255, 51, 0, 0.4);
            border-radius: 6px;
            padding: 0 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .btn-delete-single:hover {
            background-color: #ff3300;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 51, 0, 0.6);
        }

        .label-box {
            text-align: left;
            font-weight: bold;
            font-size: 11px;
            color: #b08868;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #status {
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            text-align: left;
            margin-bottom: 15px;
            display: none;
            background: rgba(10, 5, 2, 0.9);
            border: 1px solid rgba(255, 102, 0, 0.4);
            color: #ffd1a4;
            white-space: pre-line;
            max-height: 100px;
            overflow-y: auto;
        }

        #dataContainer {
            max-height: 320px;
            overflow-y: auto;
            text-align: left;
        }

        .map-instruction {
            position: absolute;
            top: 20px; 
            right: 40px; 
            z-index: 10;
            display: flex; 
            align-items: center; 
            pointer-events: none;
        }
        
        .instruction-text {
            background: var(--primary-orange);
            color: black; 
            padding: 8px 15px;
            border-radius: 4px; 
            font-size: 11px; 
            font-weight: 800;
            text-transform: uppercase; 
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.6);
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 5, 2, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 102, 0, 0.4);
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            body, html { 
                overflow: auto !important; 
            }
            #mapContainer { 
                height: 50vh; 
                width: 100%; 
                position: relative; 
            }
            .control-panel {
                position: relative;
                width: 100%; 
                height: auto; 
                top: 0;
                left: 0;
                border-radius: 0px;
                border-top: 2px solid var(--primary-orange); 
                background: rgba(10,5,2,0.95);
                max-height: none;
                box-shadow: none;
                padding: 15px;
            }
            #dataContainer {
                max-height: 250px;
            }
            .map-instruction { 
                right: 10px; 
                top: 50px; 
            }
        }
    </style>
</head>
<body>

<div id="mapContainer"></div>



<div class="control-panel">
    <h2>expedisi</h2>
    
    <div class="btn-group">
        <button id="viewBtn" class="btn btn-view" onclick="fetchAndShowValues()">Refresh</button>
        <button id="deleteBtn" class="btn btn-delete" onclick="startDeletion()">Hapus Semua</button>
    </div>
    
    <button id="toggleBtn" class="btn btn-toggle" onclick="toggleExpedisiState()">PANGGIL: LOADING...</button>
    
    <div class="label-box" id="statusLabel" style="display:none;">Logs:</div>
    <div id="status"></div>

    <div class="label-box" id="previewLabel" style="display:none;">Pilih Data UNIT:</div>
    
    <div id="counterWrapper" style="display:none;">
        <div class="listed-counter">
            <span>TRACKER STATUS:</span>
            <span class="counter-value" id="listedCountText">0 UNIT LISTED</span>
        </div>
    </div>
    
    <div id="dataContainer"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const CONFIG = {
        URL: "https://super-camel-75084.upstash.io",
        TOKEN: "gQAAAAAAASVMAAIgcDI0MjBkMmM4NTRkYWU0OTEyYTZmZWU5ODkxNGI1MmNjZg",
        TARGET_KEY: "truktutup1",
        TOGGLE_KEY: "expedisi:panggil" 
    };

    const statusDiv = document.getElementById('status');
    const dataContainer = document.getElementById('dataContainer');
    const deleteBtn = document.getElementById('deleteBtn');
    const viewBtn = document.getElementById('viewBtn');
    const toggleBtn = document.getElementById('toggleBtn');
    
    const statusLabel = document.getElementById('statusLabel');
    const previewLabel = document.getElementById('previewLabel');
    const counterWrapper = document.getElementById('counterWrapper');
    const listedCountText = document.getElementById('listedCountText');

    let map;
    let activeMarker = null;
    let currentToggleState = 0; 

    window.onload = function() {
        initMap();
        fetchAndShowValues();
        getInitialToggleState(); 
    };

    function initMap() {
        // Inisialisasi peta Leaflet (tanpa API Key)
        map = L.map('mapContainer', {
            zoomControl: true,
            attributionControl: false
        }).setView([-6.17, 106.82], 12);

        // Memuat tile OpenStreetMap publik gratis
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);
    }

    function logMessage(msg) {
        statusLabel.style.display = 'block';
        statusDiv.style.display = 'block';
        statusDiv.innerText += msg + "\n";
        statusDiv.scrollTop = statusDiv.scrollHeight;
    }

    function setActionLoading(isLoading, text = "Memproses...") {
        deleteBtn.disabled = isLoading;
        viewBtn.disabled = isLoading;
        toggleBtn.disabled = isLoading;
        if(isLoading) {
            deleteBtn.innerText = text;
        } else {
            deleteBtn.innerText = "Hapus Semua";
            viewBtn.innerText = "Refresh";
        }
    }

    function updateListedCounter() {
        const count = dataContainer.querySelectorAll('.data-item-wrapper').length;
        if(count > 0) {
            counterWrapper.style.display = 'block';
            listedCountText.innerText = `${count} UNIT LISTED`;
        } else {
            counterWrapper.style.display = 'none';
        }
    }

    async function upstashFetch(command) {
        const response = await fetch(`${CONFIG.URL}`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${CONFIG.TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(command)
        });
        return response.json();
    }

    async function getInitialToggleState() {
        try {
            const res = await upstashFetch(["GET", CONFIG.TOGGLE_KEY]);
            if (!res.error && res.result !== null) {
                currentToggleState = parseInt(res.result) === 1 ? 1 : 0;
            } else {
                currentToggleState = 0; 
            }
            updateToggleUI(currentToggleState);
        } catch (e) {
            console.error("Gagal sinkronisasi state awal toggle:", e);
            toggleBtn.innerText = "PANGGIL: ERROR";
        }
    }

    async function toggleExpedisiState() {
        setActionLoading(true, "Sinkronisasi...");
        const targetState = currentToggleState === 1 ? 0 : 1;
        logMessage(`Mengubah sinyal panggil ke state: ${targetState}...`);

        try {
            const res = await upstashFetch(["SET", CONFIG.TOGGLE_KEY, String(targetState)]);
            if (res.error) throw new Error(res.error);

            currentToggleState = targetState;
            updateToggleUI(currentToggleState);
            logMessage(`[SUKSES] Sinyal panggil disetel ke: ${currentToggleState}`);
        } catch (error) {
            logMessage(`[ERROR] Gagal mengirim sinyal: ${error.message}`);
        } finally {
            setActionLoading(false);
        }
    }

    function updateToggleUI(state) {
        if (state === 1) {
            toggleBtn.classList.add('active');
            toggleBtn.innerText = "PANGGIL ACTIVATED";
        } else {
            toggleBtn.classList.remove('active');
            toggleBtn.innerText = "PANGGIL STANDBY";
        }
    }

    async function fetchAndShowValues() {
        setActionLoading(true, "Membaca...");
        statusDiv.innerText = "";
        dataContainer.innerHTML = "";
        previewLabel.style.display = 'none';
        counterWrapper.style.display = 'none';
        
        if (activeMarker) {
            map.removeLayer(activeMarker);
            activeMarker = null;
        }

        logMessage(`Mengambil log koordinat dari list '${CONFIG.TARGET_KEY}'...`);

        try {
            const res = await upstashFetch(["LRANGE", CONFIG.TARGET_KEY, "0", "-1"]);
            if (res.error) throw new Error(res.error);

            const listItems = res.result || [];

            if (listItems.length === 0) {
                logMessage("Tidak ada data pelacak di list 'truktutup1'.");
                dataContainer.innerHTML = "<div style='color: #ff3300; text-align:center; padding:10px;'>List Kosong</div>";
            } else {
                logMessage(`Sukses mendeteksi ${listItems.length} log posisi.`);
                previewLabel.style.display = 'block';
                
                const reversedItems = [...listItems].reverse();

                reversedItems.forEach((rawString, index) => {
                    let parsedData;
                    try {
                        parsedData = JSON.parse(rawString);
                    } catch(e) {
                        parsedData = rawString;
                    }
                    
                    const wrapper = document.createElement('div');
                    wrapper.className = 'data-item-wrapper';

                    const button = document.createElement('button');
                    button.className = 'data-item-btn';
                    button.id = `card-${index}`;
                    
                    let previewText = typeof parsedData === 'object' ? JSON.stringify(parsedData) : parsedData;
                    let timeLabel = parsedData.timestamp ? new Date(parsedData.timestamp).toLocaleTimeString() : `LOG #${listItems.length - index}`;
                    
                    button.innerHTML = `<strong>${timeLabel}</strong><br><span style="font-size:11px; color:#ffd1a4;">${previewText}</span>`;
                    
                    button.onclick = function() {
                        const coords = extractLatLng(parsedData);
                        if(coords) {
                            focusTarget(coords.lat, coords.lng, index);
                        } else {
                            logMessage(`[ERROR] Gagal memparsing lat/long.`);
                            alert(`Gagal mendeteksi data posisi geografis.\nData: ${previewText}`);
                        }
                    };
                    
                    const deleteSingleBtn = document.createElement('button');
                    deleteSingleBtn.className = 'btn-delete-single';
                    deleteSingleBtn.innerHTML = '🗑️';
                    deleteSingleBtn.title = "Hapus log baris ini";
                    
                    deleteSingleBtn.onclick = async function(e) {
                        e.stopPropagation();
                        if (confirm(`Apakah Anda yakin ingin menghapus baris log data ini dari database?`)) {
                            deleteSingleBtn.disabled = true;
                            deleteSingleBtn.innerText = "⏳";
                            try {
                                logMessage(`Menghapus spesifik elemen list...`);
                                const delRes = await upstashFetch(["LREM", CONFIG.TARGET_KEY, "1", rawString]);
                                if (delRes.error) throw new Error(delRes.error);
                                
                                logMessage(`Elemen sukses terhapus.`);
                                wrapper.remove();
                                updateListedCounter();
                                
                                if (activeMarker) {
                                    map.removeLayer(activeMarker);
                                    activeMarker = null;
                                }
                                
                                if(dataContainer.children.length === 0) {
                                    previewLabel.style.display = 'none';
                                    counterWrapper.style.display = 'none';
                                    dataContainer.innerHTML = "<div style='color: #ff3300; text-align:center; padding:10px;'>List Kosong</div>";
                                }
                            } catch (err) {
                                logMessage(`Gagal menghapus item: ${err.message}`);
                                deleteSingleBtn.disabled = false;
                                deleteSingleBtn.innerText = '🗑️';
                            }
                        }
                    };

                    wrapper.appendChild(button);
                    wrapper.appendChild(deleteSingleBtn);
                    dataContainer.appendChild(wrapper);
                });
                
                updateListedCounter();
            }

        } catch (error) {
            logMessage(`Gagal membaca list: ${error.message}`);
        } finally {
            setActionLoading(false);
        }
    }

    function extractLatLng(data) {
        let lat = null;
        let lng = null;
        let targetString = "";

        if (typeof data === 'object' && data !== null) {
            lat = data.lat ?? data.latitude;
            lng = data.long ?? data.lng ?? data.longitude;
        } else if (data) {
            targetString = String(data);
        }

        if (targetString && (lat === null || lng === null)) {
            const regex = /(-?\d+\.\d+)\s*[\s,]\s*(-?\d+\.\d+)/;
            const match = targetString.match(regex);
            if (match) {
                lat = match[1];
                lng = match[2];
            }
        }

        if (lat !== null && lng !== null && !isNaN(parseFloat(lat)) && !isNaN(parseFloat(lng))) {
            return { lat: parseFloat(lat), lng: parseFloat(lng) };
        }
        return null;
    }

    function focusTarget(lat, lng, index) {
        if (activeMarker) {
            map.removeLayer(activeMarker);
        }
        
        document.querySelectorAll('.data-item-btn').forEach(c => c.classList.remove('active'));
        const activeCard = document.getElementById(`card-${index}`);
        if(activeCard) {
            activeCard.classList.add('active');
            activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        const position = [lat, lng];

        // Membuat penanda ikon taktis oranye kustom menggunakan Leaflet DivIcon
        const customIcon = L.divIcon({
            className: 'custom-tactical-marker',
            html: `<div style="background-color: #ff6600; width: 16px; height: 16px; border: 2px solid #ffaa00; border-radius: 50%; box-shadow: 0 0 10px #ff6600;"></div>`,
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });

        activeMarker = L.marker(position, { icon: customIcon }).addTo(map);
        activeMarker.bindPopup(`<b>UNIT</b><br>${lat}, ${lng}`).openPopup();

        logMessage(`[SUKSES] UNIT Terkunci pada Posisi: ${lat}, ${lng}`);
        
        map.setView(position, 16, { animate: true });
    }

    async function startDeletion() {
        if (!confirm("Apakah Anda yakin ingin mengosongkan SELURUH isi list koordinat 'truktutup1'?")) return;
        
        setActionLoading(true, "Menghapus...");
        statusDiv.innerText = "";
        dataContainer.innerHTML = "";
        previewLabel.style.display = 'none';
        counterWrapper.style.display = 'none';
        
        if (activeMarker) {
            map.removeLayer(activeMarker);
            activeMarker = null;
        }

        logMessage("Melakukan pembersihan total key 'truktutup1'...");

        try {
            const delRes = await upstashFetch(["DEL", CONFIG.TARGET_KEY]);
            if (delRes.error) throw new Error(delRes.error);

            logMessage(`Pembersihan sukses. Database list dikosongkan.`);
            dataContainer.innerHTML = "<div style='color: #ff3300; text-align:center; padding:10px;'>List Kosong</div>";

        } catch (error) {
            logMessage(`Terjadi kesalahan saat wipe: ${error.message}`);
        } finally {
            setActionLoading(false);
        }
    }
</script>

</body>
</html>
